          description: Monotonic erasure generation; a positive tombstone dominates
            all non-erasure events for this immutable patient ID.
        restrictionPolicyVersion:
          "$ref": "#/components/schemas/OpaqueReference"
      required:
      - patientId
      - recordRevision
      - accessGeneration
      - deletionGeneration
      - restrictionPolicyVersion
      description: Restriction notification; the restriction and revision are already
        committed. Not a permission grant or the sole revocation freshness mechanism.
