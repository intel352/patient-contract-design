          items:
            "$ref": "#/components/schemas/AuditDisclosureReference"
      required:
      - actorRef
      - requestId
      - operation
      - decision
      - policyVersion
      - disclosures
      description: Restricted application audit intent, not proof of browser receipt.
        Empty disclosures is valid for an authorized no-match lookup. No token, raw
        claims, search value, contact data or free text.
