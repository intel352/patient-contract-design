        erasureRequestId:
          "$ref": "#/components/schemas/OpaqueReference"
        completionEvidenceRef:
          "$ref": "#/components/schemas/OpaqueReference"
      required:
      - patientId
      - recordRevision
      - accessGeneration
      - deletionGeneration
      - erasureRequestId
      - completionEvidenceRef
      description: Emitted only after the erasure workflow is completed, including
        its backup/restore and registered-copy obligations. Never emitted for 202
        acceptance or active_data_erased alone; unresolved retention is not completion.
    AuditDisclosureReference:
      type: object
      additionalProperties: false
      properties:
        patientId:
          "$ref": "#/components/schemas/OpaqueReference"
        recordRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        fieldCategories:
          type: array
          uniqueItems: true
          maxItems: 14
          items:
            type: string
            enum:
            - name
            - name.display
            - name.given
            - name.family
            - phones
            - phones[].e164
            - phones[].extension
            - address
            - address.countryCode
            - address.lines
            - address.locality
            - address.administrativeArea
            - address.postalCode
            - comment
      required:
      - patientId
      - recordRevision
      - fieldCategories
      description: Exact disclosed field categories for one patient, including authorized
        container metadata; contains no values or principal-bound ETag.
