---
asyncapi: 3.1.0
id: urn:patient-contact:application:regional-publishers
info:
  title: Patient Contact regional event publishers
  version: 0.1.0
  description: Unreleased documentation-only proposal for the patient service publishing
    boundary, including API audit producer and transactional-outbox relay. Operations
    are from this publisher application perspective. Workers are separate receiving
    applications; their own operations/queue mappings must be qualified, not inferred
    by flipping send to receive. Event payloads proposed as v1/1.0.0 are not released
    contracts. See ../docs/events.md.
defaultContentType: application/cloudevents+json
servers:
  regionalSqs:
    host: sqs.{region}.amazonaws.com
    protocol: sqs
    description: Illustrative commercial-AWS regional SQS endpoint, accessed using
      TLS/SigV4 and IAM workload identity. Region/cell/account ownership is backend
      controlled; AWS China requires separate deployment qualification. Defaults are
      synthetic examples, not selected launch placement.
    variables:
      region:
        default: us-east-1
        description: Qualified AWS deployment region, never chosen by event input.
    x-aws-authentication:
      signing: AWS Signature Version 4
      credentials: short-lived workload identity
      authorization: least-privilege queue and KMS policies; separate domain and audit
        roles
channels:
  domainEvents:
    address: patient-contact-domain-events
    description: One regional cell/environment queue with competing replicas of one
      domain-worker application; independent subscribers require distinct queues/fanout.
    servers:
    - "$ref": "#/servers/regionalSqs"
    messages:
      PatientCreated:
        "$ref": "#/components/messages/PatientCreated"
      PatientUpdated:
        "$ref": "#/components/messages/PatientUpdated"
      PatientRestricted:
        "$ref": "#/components/messages/PatientRestricted"
      PatientErasureCompleted:
        "$ref": "#/components/messages/PatientErasureCompleted"
      PatientErasureStarted:
        "$ref": "#/components/messages/PatientErasureStarted"
    bindings:
      sqs:
        bindingVersion: 0.3.0
        queue:
          name: patient-contact-domain-events
          fifoQueue: false
    x-address-resolution: Logical queue name; deployment inventory resolves the actual
      account, cell, environment, queue URL/ARN, KMS key and DLQ. No cloud resource
      is created by this document.
  auditIntents:
    address: patient-contact-audit-intents
    description: Separate restricted regional audit queue; durable acceptance is required
      before disclosure. Audit archive worker is independently authorized.
    servers:
    - "$ref": "#/servers/regionalSqs"
    messages:
      AuditDisclosureIntent:
        "$ref": "#/components/messages/AuditDisclosureIntent"
    bindings:
      sqs:
        bindingVersion: 0.3.0
        queue:
          name: patient-contact-audit-intents
          fifoQueue: false
    x-address-resolution: Logical queue name; deployment inventory resolves the actual
      account, cell, environment, queue URL/ARN, KMS key and DLQ. No cloud resource
      is created by this document.
operations:
  publishDomainEvents:
    action: send
    title: Durable outbox relay publishes committed domain events
    channel:
      "$ref": "#/channels/domainEvents"
    messages:
    - "$ref": "#/channels/domainEvents/messages/PatientCreated"
    - "$ref": "#/channels/domainEvents/messages/PatientUpdated"
    - "$ref": "#/channels/domainEvents/messages/PatientRestricted"
    - "$ref": "#/channels/domainEvents/messages/PatientErasureCompleted"
    - "$ref": "#/channels/domainEvents/messages/PatientErasureStarted"
    x-delivery-semantics: at-least-once; duplicates and out-of-order delivery possible
    x-authorization: AWS SigV4 using a scoped workload identity and queue/KMS policies.
      No end-user JWT is placed in a message.
  publishDisclosureIntent:
    action: send
    title: API durably publishes authorized disclosure intent before returning protected
      data
    channel:
      "$ref": "#/channels/auditIntents"
    messages:
    - "$ref": "#/channels/auditIntents/messages/AuditDisclosureIntent"
    x-delivery-semantics: at-least-once; duplicates and out-of-order delivery possible
    x-authorization: AWS SigV4 using a scoped workload identity and queue/KMS policies.
      No end-user JWT is placed in a message.
