  schemas:
    OpaqueReference:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
      description: Restricted, linkable opaque reference. No patient values, raw identity-provider
        subjects, credentials or phone hashes. Not a telemetry label.
    Sequence:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    PatientChangeData:
      type: object
      additionalProperties: false
      properties:
        patientId:
          "$ref": "#/components/schemas/OpaqueReference"
        recordRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Monotonic internal patient aggregate revision, committed with
            the mutation. Not the principal-bound REST ETag.
        accessGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Monotonic patient restriction generation. Consumers cannot
            reset restrictions from an older or ordinary update event.
        deletionGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Monotonic erasure generation; a positive tombstone dominates
            all non-erasure events for this immutable patient ID.
      required:
      - patientId
      - recordRevision
      - accessGeneration
      - deletionGeneration
      description: Reference-only mutation notification. An authorized consumer resolves
        current authoritative state; no patient snapshot or changed values are published.
